<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C86A49"/>
      <stop offset="1" stop-color="#6C4EAF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#sheen)"/>

  <text x="100" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#ffffff" fill-opacity="0.75">W3C AI CONTENT DISCLOSURE VOCABULARY</text>

  <text x="98" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">AI Disclosure Badges</text>

  <text x="100" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#ffffff" fill-opacity="0.9">Badge generator + GitHub Action &#8212; no vocabulary knowledge needed</text>

  <!-- the actual shields.io badges the generator produces, embedded verbatim at 2x scale -->
  <g filter="url(#shadow)">
    <svg x="100" y="432" width="320" height="40" viewBox="0 0 160 20"><rect width="83" height="20" fill="#555"/><rect x="83" width="77" height="20" fill="#c86a49"/><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text x="425" y="140" textLength="730" transform="scale(.1)">AI Disclosure</text><text x="1205" y="140" textLength="670" transform="scale(.1)">human-only</text></g></svg>
    <svg x="444" y="432" width="304" height="40" viewBox="0 0 152 20"><rect width="83" height="20" fill="#555"/><rect x="83" width="69" height="20" fill="#6b7280"/><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text x="425" y="140" textLength="730" transform="scale(.1)">AI Disclosure</text><text x="1165" y="140" textLength="590" transform="scale(.1)">ai-assisted</text></g></svg>
    <svg x="772" y="432" width="352" height="40" viewBox="0 0 176 20"><rect width="83" height="20" fill="#555"/><rect x="83" width="93" height="20" fill="#6c4eaf"/><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text x="425" y="140" textLength="730" transform="scale(.1)">AI Disclosure</text><text x="1285" y="140" textLength="830" transform="scale(.1)">ai-autonomous</text></g></svg>
  </g>

  <text x="100" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#ffffff" fill-opacity="0.85">Answer a short yes/no ladder &#8594; get the right badge, markdown, and spec markup</text>

  <text x="100" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.65">github.com/dcondrey/ai-disclosure-badges</text>
</svg>
