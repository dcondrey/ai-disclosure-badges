<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C86A49"/>
      <stop offset="1" stop-color="#6C4EAF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#sheen)"/>

  <text x="100" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#ffffff" fill-opacity="0.75">W3C AI CONTENT DISCLOSURE VOCABULARY</text>

  <text x="98" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">AI Disclosure Badges</text>

  <text x="100" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#ffffff" fill-opacity="0.9">Badge generator + GitHub Action &#8212; no vocabulary knowledge needed</text>

  <!-- badge chips, colors match badge-logic.js exactly -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
    <g transform="translate(100, 410)">
      <rect width="330" height="56" rx="6" fill="#000000" fill-opacity="0.16"/>
      <rect width="326" height="56" rx="6" fill="#C86A49"/>
      <text x="24" y="36">AI Disclosure: human-only</text>
    </g>
    <g transform="translate(450, 410)">
      <rect width="330" height="56" rx="6" fill="#000000" fill-opacity="0.16"/>
      <rect width="326" height="56" rx="6" fill="#6B7280"/>
      <text x="24" y="36">AI Disclosure: ai-assisted</text>
    </g>
    <g transform="translate(800, 410)">
      <rect width="360" height="56" rx="6" fill="#000000" fill-opacity="0.16"/>
      <rect width="356" height="56" rx="6" fill="#6C4EAF"/>
      <text x="24" y="36">AI Disclosure: ai-autonomous</text>
    </g>
  </g>

  <text x="100" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#ffffff" fill-opacity="0.85">Answer a short yes/no ladder &#8594; get the right badge, markdown, and spec markup</text>

  <text x="100" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.65">github.com/dcondrey/ai-disclosure-badges</text>
</svg>
