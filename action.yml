name: 'AI Disclosure Reminder'
description: 'Reminds PR authors to disclose AI involvement if the PR body does not already say so. Never fails the workflow.'
author: 'dcondrey'
branding:
  icon: 'message-circle'
  color: 'gray-dark'

inputs:
  github-token:
    description: 'Token used to read and post PR comments (needs pull-requests: write).'
    required: true

runs:
  using: 'node20'
  main: 'action/index.js'
